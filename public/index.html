<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AQuizBuild</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1><span class="mark">A</span>QuizBuild</h1>
      <p class="tagline">Describe a topic. Get a quiz. Get graded.</p>
    </header>

    <!-- Step 1: build the quiz -->
    <section id="builder" class="card">
      <form id="quiz-form" autocomplete="off">
        <label class="field">
          <span class="label">What should the quiz cover?</span>
          <input
            id="prompt"
            name="prompt"
            type="text"
            placeholder="e.g. JavaScript closures"
            required
            minlength="3"
          />
        </label>

        <div class="row">
          <label class="field">
            <span class="label">Questions</span>
            <input id="questionCount" name="questionCount" type="number" value="5" min="1" max="20" />
          </label>

          <label class="field">
            <span class="label">Difficulty</span>
            <select id="difficulty" name="difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </label>

          <label class="field">
            <span class="label">Type</span>
            <select id="questionType" name="questionType">
              <option value="multiple-choice" selected>Multiple choice</option>
              <option value="true-false">True / False</option>
              <option value="short-answer">Short answer</option>
              <option value="mixed">Mixed</option>
            </select>
          </label>
        </div>

        <button id="generate-btn" class="btn primary" type="submit">Generate quiz</button>
      </form>

      <p id="builder-error" class="error" hidden></p>
    </section>

    <!-- Loading -->
    <section id="loading" class="card center" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p class="muted">Writing your questions…</p>
    </section>

    <!-- Step 2: take the quiz -->
    <section id="quiz" hidden>
      <div class="quiz-head">
        <div>
          <h2 id="quiz-title"></h2>
          <p class="muted" id="quiz-meta"></p>
        </div>
        <button id="restart-btn" class="btn ghost" type="button">New quiz</button>
      </div>

      <form id="answers-form">
        <div id="questions"></div>
        <button id="submit-btn" class="btn primary" type="submit">Submit answers</button>
        <p id="quiz-error" class="error" hidden></p>
      </form>
    </section>

    <!-- Step 3: results -->
    <section id="results" hidden>
      <div class="card score-card">
        <div class="score-ring" id="score-ring">
          <span id="score-value"></span>
        </div>
        <div>
          <h2 id="score-headline"></h2>
          <p class="muted" id="score-sub"></p>
        </div>
      </div>
      <div id="review"></div>
      <button id="again-btn" class="btn primary" type="button">Build another quiz</button>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
